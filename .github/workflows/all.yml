name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.python.cp }}-${{ matrix.platform_tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python:
          - { version: "3.9",  cp: cp39 }
          - { version: "3.10", cp: cp310 }
          - { version: "3.11", cp: cp311 }
          - { version: "3.12", cp: cp312 }
          - { version: "3.13", cp: cp313 }
          - { version: "3.14", cp: cp314 }
        include:
          # macOS is arm64-only: the macos-13 (Intel) runner image is retired,
          # and its jobs simply queued forever.
          - { os: ubuntu-24.04, platform_tag: manylinux_x86_64 }
          - { os: macos-14,     platform_tag: macosx_arm64 }
          - { os: windows-2022, platform_tag: win_amd64 }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # setup.py compiles the extension itself, so the only things the runner
      # has to provide are the toolchains it cannot install for itself.
      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      # The manylinux images already ship a recent CMake.
      - name: Get CMake
        if: runner.os != 'Linux'
        uses: lukka/get-cmake@v4.4.0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_BUILD: ${{ matrix.python.cp }}-${{ matrix.platform_tag }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.python.cp }}-${{ matrix.platform_tag }}
          path: ./wheelhouse/*.whl

  docs:
    name: Build docs
    # The API reference is generated by autodoc from the compiled extension, so
    # the docs build needs a real wheel to import.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: wheels-cp313-manylinux_x86_64
          path: wheelhouse

      - name: Install Vita and doc dependencies
        run: |
          pip install wheelhouse/*.whl
          pip install -r docs/requirements.txt

      # -W turns warnings into errors so a missing docstring target or a broken
      # cross-reference fails the build instead of silently shipping.
      - name: Build docs
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy-docs:
    name: Deploy docs to GitHub Pages
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Nothing else ties the release tag to the version the wheels are built with,
  # so a mismatch would quietly publish the wrong version to PyPI. This runs
  # with no dependencies, so it goes red within seconds of publishing a release
  # rather than after the whole wheel matrix.
  check-version:
    name: Check tag matches vita/version.py
    runs-on: ubuntu-24.04
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v7

      - name: Compare release tag with the packaged version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'\"([^\"]+)\"', pathlib.Path('vita/version.py').read_text()).group(1))")
          echo "vita/version.py = $version"
          echo "release tag     = $TAG"
          if [ "$TAG" != "v$version" ] && [ "$TAG" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match vita/version.py ($version). Bump the version, or retag."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no '## [$version]' section."
          fi

  upload-pypi:
    name: Upload wheels to PyPI
    needs: [build, docs, check-version]
    runs-on: ubuntu-24.04
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      # Consider switching to PyPI Trusted Publishing (OIDC) to retire this
      # long-lived token; that needs a publisher configured on the PyPI side.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          # PyPI rejects a version that already exists, which would otherwise
          # make re-running a partially failed release error out on the wheels
          # that already landed.
          skip-existing: true
